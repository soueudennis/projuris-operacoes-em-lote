<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Operações em Lote com IA · Projuris Empresas</title>
  <meta name="viewport" content="width=1440" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="list-screen.jsx"></script>
  <script type="text/babel" src="config-panel.jsx"></script>

  <script type="text/babel">
    function App() {
      const [selectedIds, setSelectedIds] = React.useState([1, 4, 5, 7, 8, 9, 10, 11, 12]);
      const [modalOpen, setModalOpen] = React.useState(false);
      const [initialOp, setInitialOp] = React.useState(null);

      const openBulk = (op) => {
        setInitialOp(op);
        setModalOpen(true);
      };
      const selectedProcesses = PROCESSES.filter(p => selectedIds.includes(p.id));

      return (
        <div className="app">
          <Sidebar />
          <main>
            <TopBar crumbs={['Início', 'Processos']} />
            <ListScreen
              selectedIds={selectedIds}
              setSelectedIds={setSelectedIds}
              onOpenBulk={openBulk}
            />
            <BulkModal
              open={modalOpen}
              onClose={() => setModalOpen(false)}
              processes={selectedProcesses}
              initialOp={initialOp}
            />
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
